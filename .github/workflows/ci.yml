name: CI — Modular Monolith Quality & Architecture Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Ruff + Mypy + Alembic Head + Architecture + Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Type-check with Mypy (strict)
        run: mypy --strict src tests

      - name: Verify single Alembic migration head
        run: |
          HEAD_COUNT=$(alembic heads | wc -l)
          echo "Alembic heads count: $HEAD_COUNT"
          test "$HEAD_COUNT" -eq 1

      - name: Run Architecture Contracts, Golden Regression & Unit/Integration Tests
        run: pytest -v

  frontend:
    name: Frontend (ESLint + Next.js Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js production bundle
        run: npm run build
